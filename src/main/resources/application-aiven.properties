
# ============================================================
# CIUDADCONECTA PC8 - PERFIL AIVEN (MySQL 8.4)
# Activar con SPRING_PROFILES_ACTIVE=aiven
# ============================================================

# Controlador MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Conexion Aiven
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:27500}/${DB_NAME:ciudadconecta}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# SSL: verificar certificado y nombre del servidor
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${DB_TRUSTSTORE_URL}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${DB_TRUSTSTORE_PASSWORD}

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=15000

# Validar esquema existente; NO modificar tablas
spring.jpa.hibernate.ddl-auto=validate

# Hibernate
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf
spring.thymeleaf.cache=true

# Funciones de demostracion y correo desactivadas
app.demo.enabled=false
app.mail.enabled=false
