spring.application.name=plataforma-ciudadana-pc8
server.port=${PORT:8080}

# MariaDB local: definir DB_PASSWORD en la configuracion de ejecucion de STS.
# Puedes personalizar DB_HOST, DB_PORT, DB_NAME y DB_USER.
spring.datasource.url=jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:pc8_ciudadana}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${DB_USER:pc8_app}
spring.datasource.password=${DB_PASSWORD}

# Solo para desarrollo; en produccion, gestionar migraciones con Flyway o Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
spring.thymeleaf.cache=false
server.error.include-message=never
app.upload.dir=./uploads

app.demo.enabled=${DEMO_USERS_ENABLED:false}
app.demo.password=${DEMO_PASSWORD:}

# Fase 2: Email optativo. Requiere servidor SMTP y credenciales de aplicación.
# Por defecto, las notificaciones dentro de CiudadConecta siguen activas SIN correo.
app.mail.enabled=${EMAIL_NOTIFICATIONS_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@localhost}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Conexión por red local: restringe el firewall a tu red privada.
server.address=0.0.0.0

# Etapa integral 1: plazo interno inicial (en horas), configurable y no oficial.
app.sla.horas-default=${SLA_HORAS:72}

# Inicialización segura del primer administrador
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.nombre=${ADMIN_BOOTSTRAP_NAME:}
app.admin.bootstrap.dni=${ADMIN_BOOTSTRAP_DNI:}
app.admin.bootstrap.correo=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
